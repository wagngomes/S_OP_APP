# T037 — Provisionamento de dashboards a partir de arquivos JSON
apiVersion: 1

providers:
  - name: SOP_APP
    orgId: 1
    folder: SOP_APP
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
